[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantvol"
version = "1.0.0"
description = "Regime-aware, vectorized systematic backtesting framework with look-ahead-safe execution and stress testing."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shreyas" }]
requires-python = ">=3.10"
keywords = ["backtesting", "quantitative-finance", "volatility", "regime-detection", "systematic-trading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.30", "openpyxl>=3.1"]
data = ["yfinance>=0.2.40"]
docs = ["playwright>=1.44"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas-stubs",
    "pre-commit>=3.7",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[project.scripts]
quantvol = "quantvol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantvol = ["py.typed", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: tests that need internet access (skipped by default)"]

[tool.coverage.run]
source = ["quantvol"]
branch = true
# yahoo.py needs the network. dashboard.py is exercised by tests/test_dashboard.py (Streamlit's
# AppTest), but Streamlit's script runner is not traced by coverage, so it would read as 0%.
omit = ["src/quantvol/data/yahoo.py", "src/quantvol/dashboard.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "SIM", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/quantvol"]
ignore_missing_imports = true
# pandas-stubs types most Series/DataFrame ops as Any; flagging every return is pure noise.
warn_return_any = false
